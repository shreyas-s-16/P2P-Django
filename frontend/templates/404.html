{% extends 'base.html' %}

{% block title %}404 - Link Not Found · LinkSnip{% endblock %}

{% block content %}
<div style="text-align: center; padding: 6rem 1rem;">
  <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; margin-bottom: 1.5rem;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
  </div>
  <h1 style="font-family: var(--font-display); font-size: 2.25rem; font-weight: 800; color: #fff; margin-bottom: 0.75rem;">
    404 · Link Not Found
  </h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; max-width: 520px; margin: 0 auto 2rem auto;">
    The short link <code style="color: var(--neon-orange); background: var(--bg-surface); padding: 0.2rem 0.5rem; border-radius: 4px;">/{{ code }}</code> does not exist or has been archived.
  </p>
  <a href="/" class="btn-primary" style="display: inline-flex;">
    ← Back to Dashboard
  </a>
</div>
{% endblock %}
